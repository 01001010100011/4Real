  <text x="30" y="17" font-family="Space Mono, monospace" font-size="3.6" font-weight="700" letter-spacing="1.1" fill="#A5D8FF">IL PROGRAMMA · LISTA N. 2</text>
  <text x="14" y="34" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Sette temi, azioni concrete</text>

  <g font-family="Plus Jakarta Sans, sans-serif">
    <text x="14" y="48" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">01</text>
    <text x="23" y="48" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Digitalizzazione reale</text>
    <text x="23" y="54" font-size="3.8" fill="#9FB0C9">Stessi strumenti e stesse opportunità per ogni studente.</text>

    <text x="14" y="68" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">02</text>
    <text x="23" y="68" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Cogestione &amp; assemblee vive</text>
    <text x="23" y="74" font-size="3.8" fill="#9FB0C9">Assemblee tematiche, dibattiti, workshop con esperti esterni.</text>

    <text x="14" y="88" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">03</text>
    <text x="23" y="88" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Sport &amp; tornei d'istituto</text>
    <text x="23" y="94" font-size="3.8" fill="#9FB0C9">Tornei tutto l'anno e Giornata dello Sport con altre scuole.</text>

    <text x="14" y="108" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">04</text>
    <text x="23" y="108" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Festa di fine anno</text>
    <text x="23" y="114" font-size="3.8" fill="#9FB0C9">In orario scolastico, organizzata con voi, aperta a tutti.</text>

    <text x="14" y="128" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">05</text>
    <text x="23" y="128" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Annuario d'Istituto</text>
    <text x="23" y="134" font-size="3.8" fill="#9FB0C9">I tuoi ricordi stampati bene: costo indicativo 5–10€.</text>

    <text x="14" y="148" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">06</text>
    <text x="23" y="148" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Box di San Valentino</text>
    <text x="23" y="154" font-size="3.8" fill="#9FB0C9">Form online e consegna anonima: nessuno sa niente.</text>

    <text x="14" y="168" font-family="Space Mono, monospace" font-size="4" font-weight="700" fill="#5B9CFF">07</text>
    <text x="23" y="168" font-family="Space Grotesk, sans-serif" font-size="5.4" font-weight="700" fill="#FFFFFF">Rocci's Got Talent</text>
    <text x="23" y="174" font-size="3.8" fill="#9FB0C9">Il palco è vostro: musica, ballo, comicità, voto del pubblico.</text>
  </g>

